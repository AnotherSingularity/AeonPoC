[project]
name = "aeon"
version = "0.1.0"
description = "A small, efficient language model."
requires-python = ">=3.10"
dependencies = [
    # Pinned to a known-good stack. torch 2.11/2.12 + cu130 has a baseline-memory
    # regression that OOMs 24 GB consumer cards (3090/4090) before the first
    # forward. Install torch from the cu124 index (see README / docs/ENVIRONMENT.md):
    #   pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cu124
    "torch==2.5.1",
    "transformers==4.46.3",
    "accelerate",
    "huggingface_hub",
    "numpy",
    "safetensors",
]

[project.optional-dependencies]
dev = ["pytest", "psutil"]
data = ["datasets"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aeon*"]
