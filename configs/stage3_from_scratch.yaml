# Stage 3 — train from scratch (template; not yet exercised).
# No warm-start checkpoint: the model is built from `model.config` with random
# init and the whole network trains. Fill in the tokenizer and tune the config
# before using.
model:
  init: null
  tokenizer: <tokenizer-id-or-path>   # a tokenizer compatible with vocab_size below
  recursion_chunk_size: 1
  dtype: bfloat16
  config:
    vocab_size: 151936
    hidden_size: 1536
    intermediate_size: 8960
    num_hidden_layers: 28
    num_attention_heads: 12
    num_key_value_heads: 2
    max_position_embeddings: 4096
    rms_norm_eps: 1.0e-6
    rope_theta: 10000
    tie_word_embeddings: false
    h_rec: 256
    margin_h: 0.98
    margin_c: 0.95
train:
  freeze: none                 # everything trains
  steps: 100000
  batch_size: 1
  seq_len: 1536
  lr: 3.0e-4
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_steps: 2000
  seed: 42
data:
  path: ./pretrain.jsonl
  text_field: text
  curriculum: true
eval:
  every: 5000
  holdout_rows: 200
log:
  every: 50
  audit_every: 200
  checkpoint_every: 2000
  out: ./aeon_stage3
